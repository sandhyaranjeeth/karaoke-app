<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Friday Karaoke Setlist Generator</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --whatsapp: #25D366;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
      padding-bottom: 95px;
      -webkit-tap-highlight-color: transparent;
    }
    .container { max-width: 540px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 4px 0; text-align: center; }
    p.subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 0.88rem;
      margin: 0 0 16px 0;
    }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1 !important; }
    }
    .full-width { grid-column: span 2; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }
    button.generate-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button.generate-btn:active { background: var(--primary-hover); }
    button.generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    button.more-btn {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: #a5b4fc;
      border: 1.5px dashed #6366f1;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 16px;
    }
    button.more-btn:disabled { opacity: 0.5; }
    .song-card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border: 1.5px solid var(--border);
      transition: border-color 0.15s ease;
    }
    .song-card.selected {
      border-color: var(--whatsapp);
      background: #172536;
    }
    .song-card input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      accent-color: var(--whatsapp);
      flex-shrink: 0;
      cursor: pointer;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .song-meta {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .yt-link {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      background: rgba(56, 189, 248, 0.12);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      color: #38bdf8;
      text-decoration: none;
    }
    .floating-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(30, 41, 59, 0.96);
      backdrop-filter: blur(8px);
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      z-index: 20;
    }
    .floating-bar-inner {
      width: 100%;
      max-width: 540px;
      display: flex;
      gap: 10px;
    }
    .select-all-btn {
      padding: 13px 16px;
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .select-all-btn:active { background: #475569; }
    .wa-btn {
      flex: 1;
      padding: 13px;
      background: var(--whatsapp);
      color: #052e16;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      color: #f87171;
      text-align: center;
      font-size: 0.9rem;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Friday Karaoke Picker</h1>

    <div id="appScreen" style="display: none;">
      <p class="subtitle">Filter songs, tick your picks, and share to WhatsApp</p>

      <div class="form-grid">
        <div>
          <label>Language</label>
          <select id="language">
            <option value="Kannada">Kannada</option>
            <option value="Hindi">Hindi</option>
            <option value="Kannada and Hindi">Both (Kannada & Hindi)</option>
          </select>
        </div>
        <div>
          <label>Solo / Duet</label>
          <select id="type">
            <option value="Any">Any (Solo or Duet)</option>
            <option value="Solo">Solo Only</option>
            <option value="Duet">Duet Only</option>
          </select>
        </div>
        <div>
          <label>Singer(s)</label>
          <input type="text" id="singer" placeholder="e.g., SPB, Sonu Nigam, Shreya" />
        </div>
        <div>
          <label>Music Director</label>
          <input type="text" id="director" placeholder="e.g., Hamsalekha, R.D. Burman" />
        </div>
        <div>
          <label>Actor / Actress</label>
          <input type="text" id="actor" placeholder="e.g., Dr. Rajkumar, SRK" />
        </div>
        <div>
          <label>Era / Mood</label>
          <input type="text" id="mood" placeholder="e.g., 90s Melody, Party, Retro" />
        </div>
        <div class="full-width">
          <button class="generate-btn" id="genBtn" onclick="fetchSongs(false)">
            Generate Song Ideas
          </button>
        </div>
      </div>

      <div id="errorMsg" class="error"></div>
      <div id="results"></div>

      <button class="more-btn" id="moreBtn" style="display: none;" onclick="fetchSongs(true)">
        🔄 Regenerate / Load More Songs
      </button>
    </div>
  </div>

  <div class="floating-bar" id="shareBar" style="display: none;">
    <div class="floating-bar-inner">
      <button type="button" class="select-all-btn" id="selectAllBtn" onclick="toggleSelectAll()">
        Select All
      </button>
      <button type="button" class="wa-btn" onclick="shareToWhatsApp()">
        Share Selected to WhatsApp (<span id="count">0</span>)
      </button>
    </div>
  </div>

  <script>
    let allSongs = [];
    let selectedIndices = new Set();

    function initApp() {
      document.getElementById('appScreen').style.display = 'block';
    }

    async function fetchSongs(isAppend) {
      const genBtn = document.getElementById('genBtn');
      const moreBtn = document.getElementById('moreBtn');
      const errorDiv = document.getElementById('errorMsg');

      genBtn.disabled = true;
      moreBtn.disabled = true;
      errorDiv.textContent = '';

      if (isAppend) {
        moreBtn.textContent = 'Finding more songs...';
      } else {
        genBtn.textContent = 'Finding great karaoke tracks...';
        allSongs = [];
        selectedIndices.clear();
        document.getElementById('results').innerHTML = '';
        document.getElementById('shareBar').style.display = 'none';
        moreBtn.style.display = 'none';
      }

      const payload = {
        language: document.getElementById('language').value,
        type: document.getElementById('type').value,
        singer: document.getElementById('singer').value.trim(),
        director: document.getElementById('director').value.trim(),
        actor: document.getElementById('actor').value.trim(),
        mood: document.getElementById('mood').value.trim(),
        exclude: isAppend ? allSongs.map(s => s.title) : []
      };

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Failed to fetch songs');

        const startIndex = allSongs.length;
        allSongs = allSongs.concat(data.songs);
        renderSongs(data.songs, startIndex);

        document.getElementById('shareBar').style.display = 'flex';
        moreBtn.style.display = 'block';
        updateCount();
      } catch (err) {
        errorDiv.textContent = 'Error: ' + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = 'Generate Song Ideas';
        moreBtn.disabled = false;
        moreBtn.textContent = '🔄 Regenerate / Load More Songs';
      }
    }

    function renderSongs(songs, startIndex) {
      const resultsDiv = document.getElementById('results');

      songs.forEach((song, i) => {
        const index = startIndex + i;
        const ytQuery = encodeURIComponent(`${song.title} ${song.singers} karaoke`);
        const ytUrl = `https://www.youtube.com/results?search_query=${ytQuery}`;

        const card = document.createElement('div');
        card.className = 'song-card';
        card.id = `card-${index}`;
        card.innerHTML = `
          <input type="checkbox" id="chk-${index}" onchange="toggleSong(${index})" />
          <div class="song-info">
            <div class="song-title">${song.title} (${song.type})</div>
            <div class="song-meta">
              🎬 ${song.movie_or_album} • 🎤 ${song.singers}<br/>
              🎼 ${song.director} • 🎭 ${song.actor}
            </div>
            <a class="yt-link" href="${ytUrl}" target="_blank" rel="noopener">▶ Search Karaoke on YouTube</a>
          </div>
        `;
        resultsDiv.appendChild(card);
      });
    }

    function toggleSong(index) {
      const chk = document.getElementById(`chk-${index}`);
      const card = document.getElementById(`card-${index}`);
      if (chk.checked) {
        selectedIndices.add(index);
        card.classList.add('selected');
      } else {
        selectedIndices.delete(index);
        card.classList.remove('selected');
      }
      updateCount();
    }

    function toggleSelectAll() {
      const shouldSelectAll = selectedIndices.size < allSongs.length;

      allSongs.forEach((_, index) => {
        const chk = document.getElementById(`chk-${index}`);
        const card = document.getElementById(`card-${index}`);
        if (!chk || !card) return;

        chk.checked = shouldSelectAll;
        if (shouldSelectAll) {
          selectedIndices.add(index);
          card.classList.add('selected');
        } else {
          selectedIndices.delete(index);
          card.classList.remove('selected');
        }
      });

      updateCount();
    }

    function updateCount() {
      document.getElementById('count').textContent = selectedIndices.size;
      const selectAllBtn = document.getElementById('selectAllBtn');
      if (allSongs.length > 0 && selectedIndices.size === allSongs.length) {
        selectAllBtn.textContent = 'Deselect All';
      } else {
        selectAllBtn.textContent = 'Select All';
      }
    }

    function shareToWhatsApp() {
      if (selectedIndices.size === 0) {
        alert('Please tick at least one song to share!');
        return;
      }

      const sortedIndices = Array.from(selectedIndices).sort((a, b) => a - b);
      let message = `🎤 *Friday Karaoke Picks* 🎶

`;

      sortedIndices.forEach((idx, i) => {
        const s = allSongs[idx];
        message += `${i + 1}. *${s.title}* (${s.type})
`;
        message += `   _Singer:_ ${s.singers} | _Movie:_ ${s.movie_or_album}

`;
      });

      const waUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    initApp();
  </script>
</body>
</html>
